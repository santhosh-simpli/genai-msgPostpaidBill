# Server Configuration
server.port=8080
spring.application.name=MSG Telecom Postpaid Billing System

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:postpaid_billing
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# SpringDoc OpenAPI Configuration (Swagger UI)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.use-root-path=true

# Logging Configuration
logging.level.com.msg.telecom=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO

# JWT Configuration
jwt.secret=MSG_TELECOM_SECRET_KEY_FOR_JWT_TOKEN_GENERATION_2026_VERY_SECURE_KEY
jwt.expiration=86400000

# Email Configuration (Gmail SMTP - for production, use proper mail service)
# To use Gmail: 1) Enable 2FA on your Google account, 2) Create an App Password at https://myaccount.google.com/apppasswords
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:santhoshgupta4@gmail.com}
spring.mail.password=${MAIL_PASSWORD:Santhosh@143}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Company Configuration
app.company.name=MSG Telecom
app.company.phone=1-800-MSG-TELCO
app.company.email=support@msgtelecom.com
